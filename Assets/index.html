<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rugby Nations 26 - Web</title>
<style>
  body { margin:0; overflow:hidden; background:#1a5c2a; font-family:Arial; }
  #ui { position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,0.6); padding:10px; border-radius:10px; }
  #controls { position:absolute; bottom:10px; width:100%; text-align:center; color:white; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <div>🏉 RUGBY NATIONS 26 - WEB</div>
  <div id="score">Essais: 0</div>
  <div id="dist">Distance: 0m</div>
</div>
<div id="controls">ZQSD / Flèches pour courir - ESPACE pour sprinter</div>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a5c2a);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lumières
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10,20,10);
scene.add(sun);

// Terrain
const field = new THREE.Mesh(new THREE.PlaneGeometry(200, 100), new THREE.MeshStandardMaterial({color:0x2e8b47}));
field.rotation.x = -Math.PI/2;
scene.add(field);

// Lignes
for(let i=-80;i<=80;i+=20){
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,100), new THREE.MeshStandardMaterial({color:0xffffff}));
  line.position.set(i,0.05,0);
  scene.add(line);
}

// Joueur
const player = new THREE.Mesh(new THREE.CapsuleGeometry(0.5,1,4,8), new THREE.MeshStandardMaterial({color:0x0011ff}));
player.position.set(-70,1,0);
scene.add(player);

// Ballon
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4,16,16), new THREE.MeshStandardMaterial({color:0xffaa00}));
ball.scale.set(1.3,0.8,0.8);
scene.add(ball);

// Adversaires
let opponents = [];
for(let i=0;i<5;i++){
  const o = new THREE.Mesh(new THREE.CapsuleGeometry(0.5,1,4,8), new THREE.MeshStandardMaterial({color:0xff0000}));
  o.position.set(-30 + i*20,1,(Math.random()-0.5)*20);
  scene.add(o);
  opponents.push(o);
}

let keys = {}, tries=0;
let speed = 0.2;
window.addEventListener('keydown', e=> keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e=> keys[e.key.toLowerCase()] = false);

camera.position.set(-75,10,5);
camera.lookAt(player.position);

function animate(){
  requestAnimationFrame(animate);
  
  let moveZ = 0, moveX = 0;
  if(keys['z']||keys['arrowup']) moveX = speed;
  if(keys['s']||keys['arrowdown']) moveX = -speed;
  if(keys['q']||keys['arrowleft']) moveZ = -speed;
  if(keys['d']||keys['arrowright']) moveZ = speed;
  if(keys[' ']) { moveX *= 2; moveZ *=2; }

  player.position.x += moveX;
  player.position.z += moveZ;
  player.position.z = Math.max(-40, Math.min(40, player.position.z));

  ball.position.copy(player.position);
  ball.position.y += 0.5;
  ball.position.x += 0.8;

  // Caméra suit
  camera.position.x = player.position.x - 8;
  camera.position.z = player.position.z + 2;
  camera.lookAt(player.position.x+5,1,player.position.z);

  // Essai
  if(player.position.x > 80){
    tries++;
    document.getElementById('score').innerText = `Essais: ${tries}`;
    player.position.set(-70,1,0);
  }
  document.getElementById('dist').innerText = `Distance: ${Math.floor(player.position.x+70)}m / 150m`;

  // Collision simple
  opponents.forEach(o=>{
    if(player.position.distanceTo(o.position) < 1.5){
      player.position.set(-70,1,0);
    }
  });

  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
