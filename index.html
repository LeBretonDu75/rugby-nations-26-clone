<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rugby Nations 26 - Clone</title>
<style>
body{margin:0;background:#0a3418;color:white;font-family:sans-serif;overflow:hidden;touch-action:none}
#top{display:flex;justify-content:space-between;padding:8px 15px;background:#000a; font-weight:bold}
canvas{display:block;width:100vw;height:58vh;background:#2a9d3f; border-top:3px solid white;border-bottom:3px solid white}
#controls{position:relative;height:32vh;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 15px}
#joy{width:110px;height:110px;border-radius:50%;background:#ffffff20;border:2px solid #fff6;position:relative}
#stick{width:50px;height:50px;border-radius:50%;background:white;position:absolute;left:30px;top:30px}
.btn{padding:18px 22px;border-radius:12px;border:none;font-weight:900;background:white;color:#0a3418;margin:5px}
.btn:active{background:yellow}
</style>
</head>
<body>
<div id="top"><span>🇫🇷 FRANCE</span><span id="score">0 - 0</span><span>70:00</span></div>
<canvas id="g" width="900" height="400"></canvas>
<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <div><button class="btn" id="pass">PASSE</button><button class="btn" id="kick">PIED</button></div>
 <div><button class="btn" id="tackle" style="background:#ff4444;color:white;padding:22px 28px">TACLE</button></div>
</div>
<script>
const cv=document.getElementById('g'), ctx=cv.getContext('2d');
let px=150,py=200, vx=0,vy=0, bx=160,by=200, hasBall=true, scoreA=0,scoreB=0;
let mates=[{x:100,y:120},{x:100,y:280}], foes=[];
for(let i=0;i<5;i++)foes.push({x:600+Math.random()*200,y:50+Math.random()*300,vx:-1.5});
let jx=0,jy=0;
const joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let x=e.touches[0].clientX-r.left-55,y=e.touches[0].clientY-r.top-55;let d=Math.hypot(x,y);if(d>40){x=x/d*40;y=y/d*40}stick.style.left=30+x+'px';stick.style.top=30+y+'px';jx=x/40;jy=y/40;});
joy.addEventListener('touchend',()=>{stick.style.left='30px';stick.style.top='30px';jx=0;jy=0});
document.getElementById('pass').addEventListener('touchstart',()=>{if(hasBall){hasBall=false;bx=mates[0].x;by=mates[0].y; setTimeout(()=>hasBall=true,400)}});
function loop(){
 ctx.clearRect(0,0,900,400);
 ctx.strokeStyle='#fff';ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(450,0);ctx.lineTo(450,400);ctx.stroke();ctx.setLineDash([]);ctx.strokeRect(10,50,80,300);ctx.strokeRect(810,50,80,300);
 px+=jx*5; py+=jy*5; px=Math.max(20,Math.min(880,px)); py=Math.max(20,Math.min(380,py));
 if(hasBall){bx=px+15;by=py}
 // mates
 ctx.fillStyle='#0047ff'; mates.forEach(m=>{m.x+=(px-m.x)*0.02; ctx.beginPath();ctx.arc(m.x,m.y,14,0,7);ctx.fill()});
 // foes
 foes.forEach(f=>{f.x+=f.vx; if(f.x<0)f.x=880; if(Math.abs(f.x-px)<60 && Math.abs(f.y-py)<60)f.x-=2; ctx.fillStyle='#ff2222';ctx.beginPath();ctx.arc(f.x,f.y,14,0,7);ctx.fill();
  if(Math.hypot(f.x-px,f.y-py)<28 && hasBall){hasBall=false;bx=px-20; px=100; py=200;}});
 // player + ball
 ctx.fillStyle='#0047ff';ctx.beginPath();ctx.arc(px,py,16,0,7);ctx.fill();
 ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(bx,by,10,6,Math.PI/4,0,7);ctx.fill();ctx.strokeStyle='#000';ctx.stroke();
 if(bx>890){scoreA++;document.getElementById('score').textContent=scoreA+' - '+scoreB; bx=150; by=200; px=150; py=200}
 requestAnimationFrame(loop);
}loop();
</script>
</body>
</html>
