<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rugby Nations 26</title>
<style>
html,body{margin:0;background:#0a1f0e;height:100%;overflow:hidden;font-family:Impact, Arial Black;color:white;touch-action:none}
#header{background:#000;display:flex;justify-content:space-between;padding:6px 12px;font-size:18px;letter-spacing:1px}
#header span:last-child{color:#ffd700}
canvas{display:block;width:100vw;height:62vh;background:radial-gradient(#3dbb5d,#1e7a32)}
#hud{height:30vh;background:#101010;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
#joy{width:120px;height:120px;border-radius:50%;background:#ffffff15;border:3px solid #ffffff40;position:relative}
#stick{width:56px;height:56px;background:white;border-radius:50%;position:absolute;left:32px;top:32px;box-shadow:0 0 10px #000}
.btn{border:none;border-radius:18px;padding:16px 18px;font-weight:900;font-size:15px}
#pass{background:white;color:#002395} #kick{background:#ffd700;color:#000} #tackle{background:#e10600;color:white;padding:20px 26px;font-size:18px}
.score{font-size:22px}
</style>
</head>
<body>
<div id="header"><span>🇫🇷 FRA <b id="sA">0</b></span><span>6 NATIONS - 78'</span><span> <b id="sB">0</b> NZL 🇳🇿</span></div>
<canvas id="c" width="1000" height="460"></canvas>
<div id="hud">
<div id="joy"><div id="stick"></div></div>
<div style="display:flex;gap:8px;flex-direction:column"><button class="btn" id="pass">PASSE A</button><button class="btn" id="kick">JEU AU PIED</button></div>
<button class="btn" id="tackle">TACLE</button>
</div>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d');
let px=180,py=230,jx=0,jy=0,has=true,bx=200,by=230,sA=0,sB=0,ruck=false,ruckT=0;
let team=[{x:120,y:150},{x:120,y:310}], en=[{x:650,y:100},{x:700,y:180},{x:720,y:260},{x:700,y:340},{x:650,y:400}].map(e=>({...e,vx:-1.2-Math.random()}));
function drawField(){
 X.fillStyle='#2eab4a';X.fillRect(0,0,1000,460);
 X.strokeStyle='#ffffffcc';X.lineWidth=3;X.strokeRect(20,20,960,420);
 X.beginPath();X.moveTo(500,20);X.lineTo(500,440);X.stroke();X.setLineDash([12,12]);X.stroke();X.setLineDash([]);
 X.strokeRect(20,120,110,220);X.strokeRect(870,120,110,220);
 // H
 X.fillRect(20,205,8,50);X.fillRect(20,205,25,6);X.fillRect(20,249,25,6);
 X.fillRect(972,205,8,50);X.fillRect(955,205,25,6);X.fillRect(955,249,25,6);
}
function loop(){
 drawField();
 if(!ruck){
  px+=jx*6;py+=jy*6;px=Math.max(40,Math.min(960,px));py=Math.max(40,Math.min(420,py));
  if(has){bx=px+18;by=py}
 }
 // team blue
 X.fillStyle='#002395'; team.forEach(t=>{t.x+=(px-t.x)*0.015; t.y+=(py-t.y)*0.015; X.beginPath();X.arc(t.x,t.y,15,0,7);X.fill();X.fillStyle='white';X.font='10px Arial';X.fillText('FRA',t.x-12,t.y-18);X.fillStyle='#002395'});
 // enemies black
 X.fillStyle='#111'; en.forEach(e=>{if(!ruck){e.x+=e.vx; if(e.x<0){e.x=980;e.y=60+Math.random()*340} if(Math.hypot(e.x-px,e.y-py)<35 && has){ruck=true;ruckT=60;has=false}} X.beginPath();X.arc(e.x,e.y,15,0,7);X.fill()});
 // player
 X.fillStyle='#002395';X.strokeStyle='white';X.lineWidth=2;X.beginPath();X.arc(px,py,18,0,7);X.fill();X.stroke();
 // ball
 X.fillStyle='white';X.save();X.translate(bx,by);X.rotate(0.6);X.beginPath();X.ellipse(0,0,13,8,0,0,7);X.fill();X.strokeStyle='#222';X.stroke();X.restore();
 if(bx>970){sA+=5;document.getElementById('sA').textContent=sA; px=180;py=230;has=true;en.forEach(e=>e.x=650+Math.random()*200)}
 if(ruck){ruckT--; X.fillStyle='#000d';X.fillRect(0,0,1000,460);X.fillStyle='white';X.font='bold 30px Arial';X.fillText('MÊLÉE! TAPOTE TACLE!',280,230); if(ruckT<0){ruck=false;has=true;px+=80}}
 requestAnimationFrame(loop);
}loop();
// joystick
const joy=document.getElementById('joy'),st=document.getElementById('stick');
function setJoy(e){let r=joy.getBoundingClientRect();let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-60;let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-60;let d=Math.hypot(x,y);if(d>48){x=x/d*48;y=y/d*48}st.style.left=32+x+'px';st.style.top=32+y+'px';jx=x/48;jy=y/48}
joy.addEventListener('touchmove',setJoy);joy.addEventListener('touchstart',setJoy);
joy.addEventListener('touchend',()=>{st.style.left='32px';st.style.top='32px';jx=0;jy=0});
document.getElementById('pass').ontouchstart=()=>{if(has &&!ruck){has=false;let t=team[Math.random()>0.5?0:1];bx=t.x;by=t.y;setTimeout(()=>{px=t.x;py=t.y;has=true},250)}};
document.getElementById('tackle').ontouchstart=()=>{if(ruck){ruckT-=10}else{en.forEach(e=>{if(Math.hypot(e.x-px,e.y-py)<90){e.x+=60}})}};
</script>
</body>
</html>
