<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rugby Nations 26</title>
<style>
 body{margin:0;background:#0a5a20;color:white;font-family:Arial;text-align:center;overflow:hidden}
 canvas{background:#1a8a33;display:block;margin:10px auto;border:4px solid white;max-width:95vw}
 #hud{font-size:20px;font-weight:bold;padding:10px}
 button{padding:12px 24px;font-size:18px;background:white;color:#0a5a20;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div id="hud">RUGBY NATIONS 26 - Score: <span id="score">0</span> | Appuie ESPACE pour plaquer / passer</div>
<canvas id="game" width="800" height="450"></canvas>
<button onclick="reset()">RESTART</button>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let x=100,y=225,vx=0,vy=0,score=0,defs=[];
function initDefs(){defs=[];for(let i=0;i<5;i++)defs.push({x:600+Math.random()*150,y:50+Math.random()*350,vx:-2-Math.random()*2})}
function reset(){x=100;y=225;vx=3;score=0;initDefs()}
initDefs();
document.addEventListener('keydown',e=>{if(e.code==='Space'){vy=(Math.random()-0.5)*6}else if(e.code==='ArrowUp'){y-=15}else if(e.code==='ArrowDown'){y+=15}});
function loop(){
 ctx.clearRect(0,0,800,450);
 ctx.strokeStyle='white';ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,450);ctx.stroke();ctx.setLineDash([]);
 // player
 x+=vx; y+=vy; y=Math.max(20,Math.min(430,y)); vy*=0.95;
 if(x>750){score++;x=100;y=225+Math.random()*100;vx+=0.3;initDefs()}
 ctx.fillStyle='blue';ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();
 // defs
 for(let d of defs){d.x+=d.vx; if(d.x<0){d.x=800;d.y=Math.random()*400} ctx.fillStyle='red';ctx.beginPath();ctx.arc(d.x,d.y,15,0,Math.PI*2);ctx.fill();
  if(Math.hypot(x-d.x,y-d.y)<30){x=100;y=225;vx=3;score=Math.max(0,score-1)}}
 document.getElementById('score').textContent=score;
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
